<title>Caddyshack: The Game</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>

</style>
<div id="stage"><canvas id="game" width="640" height="360" tabindex="0"></canvas></div>
<div id="boot">Mouse, keyboard or gamepad. Click the game to start.</div>
<script>
'use strict';
// ============================================================
//  ENGINE: canvas + 320x180 art layer, text, input (mouse,
//  keyboard, gamepad), music + sfx synth, dialog / choice /
//  fades / timers, game state
// ============================================================
const W = 640, H = 360, AW = 320, AH = 180;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

// Pixel art is drawn at 320x180 on this layer, then scaled 2x (the same resolution as Thimbleweed Park)

const FONT = '"Press Start 2P","Courier New",monospace';
function fit() {

  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();
addEventListener('pointerdown', () => audioInit());
addEventListener('touchend', () => audioInit());
const audioOn = () => !!AC && AC.state === 'running';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// adds a 1px dark outline around every opaque pixel of a canvas (used for sprites + icons)

// ---------------- text ----------------

  KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down',
  Enter: 'a', Space: 'a', KeyZ: 'a', KeyJ: 'a',
  Escape: 'b', KeyX: 'b', Backspace: 'b', KeyK: 'b',
  KeyC: 'x', KeyL: 'x', Tab: 'y', KeyV: 'y', KeyI: 'y',
  KeyQ: 'lb', KeyE: 'rb', KeyP: 'start', F1: 'start', KeyM: 'mute', KeyF: 'full',
  Digit1: 'v1', Digit2: 'v2', Digit3: 'v3', Digit4: 'v4', Digit5: 'v5', Digit6: 'v6', Digit7: 'v7', Digit8: 'v8', Digit9: 'v9'

const IN = { down: {}, prev: {}, held: {}, eaten: {}, pad: false };
let lastDt = 1 / 60;

cv.addEventListener('mousedown', e => {

function menuNav(m, n, rects) {

const DEFAULTS = {

  'Pick up': () => pick(["I don't need that.", "That's staying right where it is.", "Nope. Not mine to take.", "I'd rather not."]),
  'Use': (s, it) => it ? pick(["The " + ITEMS[it].name.toLowerCase() + " and the " + s.name.toLowerCase() + " don't go together.", "That doesn't do anything.", "Nice try. No."]) : pick(["I can't use that.", "How would I even use that?"]),
  'Talk to': s => pick(["Hello, " + s.name.toLowerCase() + ". ...Nothing.", "It's not much of a talker.", "I'm talking to a " + s.name.toLowerCase() + ". The summer heat is getting to me."]),
  'Give': (s, it) => it ? "I'd rather hang on to the " + ITEMS[it].name.toLowerCase() + "." : "Give what? Pick an item from my pockets first.",

async function doVerb(s, v, it) {

async function judgeHole() {
  const r = await playGolf('judge', { pre: async () => {
    await say('smails', 'You\'re the new caddy? Kowalski. Hmph.');
    await say('smails', 'My back is acting up. You will strike the ball, and I will take the credit. It is a common arrangement among the better sort of people.');

    await say('smails', 'Par is four. Do not disappoint me.');
  } });
  const d = r.strokes - 4, tip = d <= -1 ? 25 : d === 0 ? 15 : d === 1 ? 8 : 5;
  await say('smails', d <= 0 ? 'Hmm. Well played. By me, officially. Here is your gratuity.' : 'A disappointing hole. Nevertheless, here is your gratuity.');

  addMoney(tip);
  G.stage = 2; saveGame();
  await say('nar', 'Back at the caddy yard, word is going around: Ty Webb hit his ball into Carl the groundskeeper\'s shed. Walk right from the caddy yard to reach the rest of Bushwood.');
  await goRoom('caddyyard', 260, -1);
}

async function tyCheck() {
  if (F.ball && F.win && F.trap && !F.shedDone) await say('ty', 'Looks like the path is clear. Talk to me when you\'re ready to play through.');
}
async function playThrough() {
  const r = await playGolf('shed', { pre: async () => {
    await say('ty', 'Here\'s the situation. Ball\'s on the pile. Window\'s open. Green\'s out there.');
    await say('ty', 'Keep it low, there\'s a roof. Get it on the green within three shots and I\'ll putt out. Don\'t think about the walls.');
  } });
  if (r.success) {
    F.shedDone = 1;
    await say('ty', 'Nice.');
    await say('nar', 'Ty strolls out the door and taps the ball in without looking at it.');
    await say('ty', 'Here. Ten bucks. Caddying is like life, except you get paid.');
    addMoney(10);
    const c = await choose('Ty: "Care for a little wager? Blindfolded putting. Twenty bucks."', ['You\'re on', 'Maybe later'], 1);
    if (c === 0) await beTheBall();
    await goRoom('shed', 190, 1);
    await carlGopherIntro();
  } else {
    await say('ty', 'Hm. The ball doesn\'t know it failed. Let\'s go again. Talk to me when you\'re ready.');
    await goRoom('shed', 190, 1);
  }
}
async function beTheBall() {
  const r = await playGolf('blind', { pre: async () => {
    await say('ty', 'Three putts. You get a peek at the green, then I cover your eyes.');
    await say('ty', 'Sink it or finish within a yard and a half. Two good ones and I pay you twenty. Watch the slope arrows while you can.');
    await say('ty', 'Don\'t aim. Don\'t think. Be the ball.');
  } });
  if (r.success) { await say('ty', 'Nice. You were the ball.'); addMoney(20); F.btb = 1; }
  else await say('ty', 'You weren\'t the ball. You were more like... the rake. Ask me again anytime.');
}
async function carlGopherIntro() {
  if (G.stage !== 2) return;
  G.stage = 3; saveGame();
  await say('carl', 'Say, kid. You got a good arm. I got a gopher problem.');
  await say('carl', 'I wanna flood his tunnels and bonk him when he pops up. For that I need the big pump hose from the pool.');
  await say('carl', 'Lifeguard won\'t let me near it since... the incident.');
  await sayK('What incident?');
  await say('carl', 'Nobody knows. That\'s what makes it an incident. The pool\'s on the map now.');
}
async function giveHose() {
  if (!has('hose')) return;
  takeItem('hose'); F.hoseGiven = 1;
  await say('carl', 'Now THAT\'S a hose. Forty feet of blue revenge. Heh heh heh.');
  await say('carl', 'Alright. Let\'s go varmint huntin\'.');
  await gopherHunt();
}
async function gopherHunt() {
  const r = await playGolf('gopher', { pre: async () => {
    await say('carl', 'Tunnels are flooded. He\'s gonna pop up outta one of those holes madder than a wet cat.');
    await say('carl', 'When he pops up, you bonk him with a golf ball. Land it near him or roll it into him. Three bonks, eight balls. Go.');
  } });
  if (r.success) {
    await say('carl', 'Ha HA! Three bonks! He\'s... he\'s dancin\'. Why is he dancin\'?');
    await say('carl', 'He\'s mockin\' me. That\'s fine. This ain\'t over, varmint. This means war.');
    await say('carl', 'Here, kid. Twenty bucks. Found it in a ball washer.');
    addMoney(20); F.gopherDone = 1; G.stage = 4; saveGame();
    await say('carl', 'Oh, and some loudmouth in a purple jacket was looking for a caddy. Czervik. He\'s up at the First Tee.');
  } else await say('carl', 'He got away! That varmint... Talk to me when you wanna go again.');
  await goRoom('shed', 190, 1);
}

    // tournament flag + banner
    R(257, 70, 2, 22, '#fff'); R(259, 70, 12, 7, '#ffd84a'); R(259, 70, 12, 1, '#fff6b0'); ell(258, 92, 7, 3, '#86d870');
    // tree clusters
    for (const [x, y, r] of [[18, 20, 9], [34, 34, 7], [300, 20, 10], [306, 100, 9], [12, 90, 8], [150, 166, 9], [210, 170, 8], [96, 170, 7], [300, 168, 8], [150, 20, 7]]) {
      ell(x + 3, y + 4, r, r * .7, 'rgba(0,0,0,.25)'); disc(x, y, r, '#14401e'); disc(x, y, r - 1, '#24702e'); disc(x - 2, y - 2, r * .55, '#3f9a44'); disc(x - 3, y - 3, r * .25, '#6cc060');

}
async function openMap() { await fadeOut(.3); setScene(MapScene); sting(); await fadeIn(.3); }
const MapScene = {
  pausable: true, cur: 0, kx: 48, ky: 132, t: 0,
  enter() { playSong('groove'); const n = NODES[this.cur]; this.kx = n.x; this.ky = n.y; },
  update(dt, blocked) {
    this.t += dt;
    const n = NODES[this.cur]; this.kx = lerp(this.kx, n.x, Math.min(1, dt * 10)); this.ky = lerp(this.ky, n.y, Math.min(1, dt * 10));
    if (blocked || BUSY) return;
    const dirs = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
    for (const k in dirs) if (hit(k)) {
      const [dx, dy] = dirs[k]; let best = -1, bs = 1e9;
      NODES.forEach((m, i) => {
        if (i === this.cur) return; const vx = m.x - n.x, vy = m.y - n.y, d = Math.hypot(vx, vy), dot = (vx * dx + vy * dy) / d;
        if (dot < .3) return; const s = d * (2 - dot); if (s < bs) { bs = s; best = i; }
      });
      if (best >= 0) { this.cur = best; SFX.move(); }
    }
    if (MOUSE.active) {
      const k = NODES.findIndex(m => dist(MOUSE.x, MOUSE.y, m.x * 2, m.y * 2) < 26);
      if (k >= 0 && MOUSE.moved && k !== this.cur) { this.cur = k; SFX.move(); }
      if (k >= 0 && mhit('l')) { this.cur = k; run(() => this.go(NODES[k])); return; }
    }
    if (hit('a')) run(() => this.go(NODES[this.cur]));
  },
  async go(n) {
    const lock = nodeLock(n.id);
    if (lock) { SFX.no(); await say('nar', lock); return; }
    SFX.ok();
    switch (n.id) {
      case 'yard': return goRoom('caddyyard', 280, -1);
      case 'shed': return goRoom('shed', 40, 1);
      case 'pool': return goRoom('pool', 290, -1);
      case 'terrace': return goRoom('terrace', 45, 1);
      case 'tee': return teeEvent();
      case 'tourney': return tournamentPrompt();
    }
  },
  draw() {
    const gn = goalNode();
    art(() => {
      X.drawImage(mapBG(), 0, 0);
      NODES.forEach((n, i) => {
        const lock = nodeLock(n.id), on = i === this.cur;
        disc(n.x, n.y + 1, 5, '#1a1a1a'); disc(n.x, n.y, 5, lock ? '#666' : on ? '#ffe066' : '#f4f4f4'); disc(n.x, n.y, 2, lock ? '#333' : '#b8322a');
      });
      const b = Math.round(Math.abs(Math.sin(this.t * 5)) * 3);
      X.drawImage(spriteFor('kip', -1, 0, 0), Math.round(this.kx - 10), Math.round(this.ky - 30 - b), 20, 28);
    });
    blitArt();
    NODES.forEach((n, i) => {
      const lock = nodeLock(n.id);
      if (n.id === gn && Math.floor(this.t * 3) % 2) otxt('!', n.x * 2, n.y * 2 - 64, '#ff5252', 16);
      otxt(n.name, n.x * 2, n.y * 2 + 14, lock ? '#999' : i === this.cur ? '#ffe066' : '#fff', 8);
    });
    ctx.fillStyle = 'rgba(6,8,18,.65)'; ctx.fillRect(0, 0, W, 18); txt('BUSHWOOD COUNTRY CLUB', 8, 5, '#c9a94a'); txt('$' + G.money, W - 8, 5, '#9dff8a', 8, 'right');
    panel(0, H - 30, W, 30, 'rgba(6,8,18,.85)', '#2a3a5a');
    txt('GOAL: ' + goalText(), W / 2, H - 24, '#fff', 8, 'center');
    txt(MOUSE.active ? 'Click a place to go there' : 'Arrows / D-pad choose a place   Z / A go there', W / 2, H - 12, '#7f9fc0', 8, 'center');
  },
};

async function teeEvent() {
  if (G.stage === 4) return czervikHole();
  const c = await choose('The First Tee. Nobody needs a caddy right now. Play a practice hole?', ['Practice: Judge\'s Loop (par 4)', 'Practice: The Lake Hole (par 3)', 'Never mind'], 2);
  if (c === 2) return;
  const r = await playGolf(c === 0 ? 'judge' : 'czervik', {});
  const d = r.strokes - HOLES[c === 0 ? 'judge' : 'czervik'].par;
  await say('nar', 'Practice round: ' + r.strokes + ' strokes (' + (d === 0 ? 'even par' : d > 0 ? '+' + d : d) + ').');
  await openMap();
}
async function czervikHole() {
  const r = await playGolf('czervik', { pre: async () => {
    await say('al', 'Hey! You the caddy? Great! Al Czervik. Listen, I got a proposition.');
    await say('al', 'I hit it, you hit it, who cares. YOU hit it. Par this hole and I pay you fifty bucks. Bogey, ten. Worse, I laugh at you.');
    await sayK('Mr. Czervik, I\'m supposed to carry your bag.');
    await say('al', 'Kid, the bag carries itself. It\'s got a motor. Hit the ball! And watch the lake, it\'s full of Judge Smails\' golf balls.');
  } });
  const d = r.strokes - 3;
  if (d < 0) await say('al', 'A BIRDIE?! Kid, you\'re a natural! Fifty bucks, and I\'m telling everybody!');
  else if (d === 0) await say('al', 'PAR! Pay the man! Hey, Judge! You see that? That\'s a caddy with GAME!');
  else if (d === 1) await say('al', 'Bogey! Eh, ten bucks. Buy yourself a lesson. Or a hot dog.');
  else await say('al', 'Ha ha ha! Oof. Don\'t worry, kid, I once shot a 12 on a par 3. On purpose. For a bet.');
  addMoney(d <= 0 ? 50 : d === 1 ? 10 : 5);
  G.stage = 5; saveGame();
  await say('al', 'I\'ll be up on the clubhouse terrace. Terrible food, great view. Come say hi!');
  await say('nar', 'Time to ask about that tournament. Judge Smails holds court on the Clubhouse Terrace.');
  await openMap();
}

// ---------------- tournament ----------------
const RIVALS = [["Tony D'Annunzio", [5, 4, 5, 5, 6]], ['Motormouth', [5, 3, 6, 6, 6]], ['Porterhouse', [4, 4, 7, 5, 7]]];
const PARS = TOURNEY.map(id => HOLES[id].par);
function tSum(n) { let s = 0; for (let i = 0; i < n; i++) s += G.tScores[i] || 0; return s; }
function relStr(v) { return v === 0 ? 'E' : v > 0 ? '+' + v : '' + v; }
async function tournamentPrompt() {
  const c = await choose('Tee off in the Bushwood Caddy Scholarship Tournament? Five holes, no do-overs. Shoot 24 or better to win.', ['Tee it up!', 'Not yet'], 1);
  if (c !== 0) return;
  G.tScores = []; G.tHole = 0;
  await runTourney();
}
async function runTourney() {
  G.inTourney = 1; saveGame();
  const pre = {
    0: async () => {
      await say('lou', 'Ladies and gentlemen, welcome to the Bushwood Caddy Scholarship Tournament! Five holes! Par twenty!');
      await say('lou', 'Shoot twenty-four or better and you go to college. Shoot worse and you go back to carrying bags. Kowalski, you\'re up.');
      await say('smails', 'Don\'t embarrass me, boy. I sponsored you. I have a reputation.');
    },
    2: async () => { await say('carl', '(from the bushes) Psst. Kid. The gopher lives on this hole. Watch the creek. And the gopher. Mostly the gopher.'); },
    4: async () => {
      await say('nar', 'Black clouds roll over Bushwood. Thunder rumbles. The wind is howling left to right.');
      await say('lou', 'Nobody leaves till it\'s done! The last guy who quit in a storm like this was a bishop. Lightning. Don\'t ask.');
    },
  };
  for (let i = G.tHole; i < 5; i++) {
    const r = await playGolf(TOURNEY[i], { song: 'tourney', pre: pre[i], tourney: () => 'thru ' + i + ': ' + relStr(tSum(i) - PARS.slice(0, i).reduce((a, b) => a + b, 0)) });
    G.tScores[i] = r.strokes; G.tHole = i + 1; saveGame();
    await showScorecard(i + 1);
  }
  const total = tSum(5);
  G.inTourney = 0; G.tHole = 0; G.stage = 7; saveGame();
  if (total <= 24) await winEnding(total); else await loseEnding(total);
}
function showScorecard(n) {
  return new Promise(async res => {
    await fadeOut(.25);

      update(dt, blocked) { if (!blocked && (hit('a') || mhit('l'))) { SFX.ok(); res(); } },
      draw() {

        ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(66, 36, 520, 300);
        R(60, 30, 520, 300, '#f6f1dc'); R(60, 30, 520, 26, '#1f5a2e'); R(60, 56, 520, 2, '#c9a94a'); txt('BUSHWOOD CADDY SCHOLARSHIP - SCORECARD', W / 2, 39, '#ffe066', 8, 'center', null);
        const cx = i => 250 + i * 50;
        txt('HOLE', 80, 70, '#333', 8, 'left', null); TOURNEY.forEach((id, i) => txt('' + HOLES[id].num, cx(i), 70, '#333', 8, 'center', null)); txt('TOT', 520, 70, '#333', 8, 'center', null);
        txt('PAR', 80, 88, '#333', 8, 'left', null); PARS.forEach((p, i) => txt('' + p, cx(i), 88, '#333', 8, 'center', null)); txt('20', 520, 88, '#333', 8, 'center', null);
        R(76, 100, 488, 2, '#1f5a2e');
        const rows = [['KIP KOWALSKI', G.tScores]].concat(RIVALS);
        rows.forEach(([name, sc], r) => {
          const y = 112 + r * 22, me = r === 0;
          if (me) R(72, y - 5, 496, 18, '#fff3b0');
          txt(name, 80, y, me ? '#b0413e' : '#333', 8, 'left', null);
          for (let i = 0; i < n; i++) {

            if (me && d > 0) { ctx.strokeStyle = '#333'; ctx.strokeRect(cx(i) - 8, y - 5, 16, 16); }
            txt('' + s, cx(i), y, '#333', 8, 'center', null);
          }
          let t = 0; for (let i = 0; i < n; i++) t += sc[i];
          txt('' + t, 520, y, '#333', 8, 'center', null);
        });
        const tot = tSum(n), parN = PARS.slice(0, n).reduce((a, b) => a + b, 0);
        txt('Kip: ' + tot + ' thru ' + n + '  (' + relStr(tot - parN) + ')', W / 2, 210, '#1f5a2e', 16, 'center', null);
        const need = 24 - tot, left = 5 - n, parLeft = PARS.slice(n).reduce((a, b) => a + b, 0);
        txt(n < 5 ? (need - parLeft >= 0 ? 'Need ' + need + ' or fewer on the last ' + left + ' (' + relStr(need - parLeft) + ' vs par) to win.' : 'Need ' + need + ' on the last ' + left + '. That\'s ' + relStr(need - parLeft) + '. Miracle time.') : (tot <= 24 ? 'WINNING SCORE!' : 'Winning score was 24...'), W / 2, 244, '#333', 8, 'center', null);
        txt('Score to beat: 24 (+4)', W / 2, 264, '#b0413e', 8, 'center', null);
        if (Math.floor(performance.now() / 400) % 2) txt('Click or press Z / A to continue', W / 2, 300, '#555', 8, 'center', null);
      },
    });
    playSong('tourney'); sting();
    fadeIn(.25);
  });
}

// ---------------- endings ----------------
function endScene(drawFn) { const s = { t: 0, update(dt) { this.t += dt; }, draw() { drawFn(this.t); } }; setScene(s); return s; }
async function winEnding(total) {
  await fadeOut(.4);
  endScene(t => {
    art(() => {
      X.drawImage(titleBG(), 0, 0);
      const cast = [['lou', 40], ['smails', 80], ['ty', 120], ['kip', 162], ['al', 204], ['carl', 244], ['lacey', 282]];
      cast.forEach(([id, x], i) => drawChar(id, x, 166 - (id === 'kip' ? Math.round(Math.abs(Math.sin(t * 6)) * 8) : 0), i < 3 ? 1 : -1, 0, { talk: DLG.cur && DLG.cur.who === id }));
      drawGopher(308, 170, 1, true);
      for (let i = 0; i < 50; i++) { const x = Math.floor((hash2(i, 1) * AW + t * 20 * (hash2(i, 2) - .5) + AW) % AW), y = Math.floor((hash2(i, 3) * 120 + t * 30 * (.5 + hash2(i, 4))) % 130); R(x, y, 2, 2, ['#ffe066', '#e53935', '#4aa3ff', '#fff'][i % 4]); }
    });

  });
  playSong('title'); SFX.cheer(); sting(1); await fadeIn(.5);
  await say('lou', 'Final score for Kip Kowalski: ' + total + '! THAT\'S A WINNER! Pinky, pay up!');
  await say('smails', 'Well. Congratulations, Kowalski. I suppose. The scholarship is yours.');

}
const LOSE = { quote: false, qt: 0 };
async function loseEnding(total) {
  await fadeOut(.6);
  const LS = endScene(t => {
    R(0, 0, W, H, '#000');
    if (!LOSE.quote) { art(() => { X.clearRect(0, 0, AW, AH); X.fillStyle = '#000'; X.fillRect(0, 0, AW, AH); vgradA(100, 20, 120, 130, 'rgba(60,60,90,.35)', 'rgba(0,0,0,0)'); drawChar('smails', 160, 130, 1, 0, { talk: DLG.cur && DLG.cur.who === 'smails' }); }); blitArt(); }
    else {
      const a = Math.min(1, (t - LOSE.qt) / 2);
      ctx.globalAlpha = a;
      txt('"The world needs', W / 2, 120, '#fff', 16, 'center');
      txt('ditch-diggers too."', W / 2, 150, '#fff', 16, 'center');
      txt('- Judge Elihu Smails', W / 2, 200, '#8fb8ff', 8, 'center');
      ctx.globalAlpha = Math.max(0, Math.min(1, (t - LOSE.qt - 2.5) / 1.5));
      txt('GAME OVER  -  Final score ' + total + ' (' + relStr(total - 20) + ')', W / 2, 260, '#c0392b', 8, 'center');
      ctx.globalAlpha = 1;
    }
  });
  playSong('sad'); SFX.fail(); await fadeIn(.6);
  await say('smails', 'Final score: ' + total + '. Well, well, well, Kowalski.');
  await say('smails', 'I sponsored you. I vouched for you. And you shot ' + total + '.');
  await say('smails', 'Don\'t feel too bad, boy. Some people go to college, and some people...');
  LOSE.quote = true; LOSE.qt = LS.t;
  await wait(4.5);
  const c = await choose('Try again?', ['Replay the tournament', 'Back to title'], 1);
  LOSE.quote = false;
  if (c === 0) { G.stage = 6; G.tScores = []; G.tHole = 0; saveGame(); await runTourney(); }
  else await backToTitle();
}
async function backToTitle() { await fadeOut(.5); setScene(Title); await fadeIn(.5); }

// ---------------- pause ----------------
const PAUSE = { on: false, i: 0, ctrl: false, rects: [] };
function pauseOpts() { return ['Resume', 'Controls', 'Sound: ' + (muted ? 'OFF' : 'ON'), 'Chapters', 'Quit to Title']; }
function resetScripts() { DLG.cur = null; CHOICE.cur = null; TIMERS = []; BUSY = 0; FADE.a = 0; FADE.to = 0; FADE.res = null; }
function updatePause() {
  if (PAUSE.ctrl) { if (hit('b') || hit('a') || hit('start') || mhit('l') || mhit('r')) PAUSE.ctrl = false; return; }
  if (hit('b') || hit('start') || mhit('r')) { PAUSE.on = false; return; }
  const k = menuNav(PAUSE, 5, PAUSE.rects);
  if (k >= 0) {
    SFX.ok();
    if (k === 0) PAUSE.on = false;
    if (k === 1) PAUSE.ctrl = true;
    if (k === 2) toggleMute();
    if (k === 3) { PAUSE.on = false; resetScripts(); setScene(Chapters); playSong('title'); }
    if (k === 4) { PAUSE.on = false; resetScripts(); setScene(Title); }
  }
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  const o = pauseOpts();
  panel(220, 96, 200, 140);
  txt('PAUSED', W / 2, 108, '#ffe066', 8, 'center');
  PAUSE.rects = o.map((s, i) => ({ x: 232, y: 126 + i * 18, w: 176, h: 16 }));
  o.forEach((s, i) => { const r = PAUSE.rects[i]; if (i === PAUSE.i) { R(r.x, r.y, r.w, r.h, '#2f5d36'); txt('>', r.x + 8, r.y + 4, '#ffe066'); } txt(s, r.x + 30, r.y + 4, i === PAUSE.i ? '#fff' : '#a8c49a'); });
  txt('Progress saves automatically.', W / 2, 242, '#9fb39a', 8, 'center');
  if (PAUSE.ctrl) drawControls();
}
Golf.pausable = true;

// ---------------- cursor ----------------
function drawCursor() {
  if (!MOUSE.active) return;
  const x = Math.round(MOUSE.x), y = Math.round(MOUSE.y);
  const hot = SCENE === AdvScene && ADV.hover && !BUSY;
  const c = hot ? '#ffe066' : '#ffffff';
  for (const [dx, dy, w, h] of [[-9, -1, 6, 2], [4, -1, 6, 2], [-1, -9, 2, 6], [-1, 4, 2, 6]]) { ctx.fillStyle = '#000'; ctx.fillRect(x + dx - 1, y + dy - 1, w + 2, h + 2); }
  for (const [dx, dy, w, h] of [[-9, -1, 6, 2], [4, -1, 6, 2], [-1, -9, 2, 6], [-1, 4, 2, 6]]) { ctx.fillStyle = c; ctx.fillRect(x + dx, y + dy, w, h); }
}

// ---------------- loop ----------------
let lastT = 0;
const bootEl = document.getElementById('boot');
function frame(ts, manual) {
  if (ts <= lastT) { if (!manual) requestAnimationFrame(frame); return; }
  const dt = Math.min(.05, (ts - lastT) / 1000 || 0); lastT = ts; lastDt = dt;
  pollInput(dt);
  if (bootEl && (ACTS.some(a => IN.down[a]) || MOUSE.active)) bootEl.style.display = 'none';
  if (hit('mute')) toggleMute();
  if (hit('full')) { try { document.fullscreenElement ? document.exitFullscreen() : cv.requestFullscreen(); } catch (e) { } }
  if (PAUSE.on) updatePause();
  else {
    if (SCENE && SCENE.pausable && !DLG.cur && !CHOICE.cur && hit('start')) { PAUSE.on = true; PAUSE.i = 0; SFX.ok(); }
    updateTimers(dt);
    if (CHOICE.cur) updateChoice(); else if (DLG.cur) updateDlg(dt);
    if (SCENE) SCENE.update(dt, !!(DLG.cur || CHOICE.cur));
  }
  updateFade(dt);
  ctx.imageSmoothingEnabled = false;
  if (SCENE) SCENE.draw();
  drawDlg(); drawChoice(); drawToasts(PAUSE.on ? 0 : dt);
  if (PAUSE.on) drawPause();
  if (!muted && !audioOn() && Math.floor(ts / 600) % 3) {
    // browsers block audio until a click or key press; a gamepad button doesn't count
    const msg = 'SOUND IS OFF: click the game or press any key';
    ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillRect(W - msg.length * 8 - 20, 40, msg.length * 8 + 14, 16);
    txt(msg, W - 13, 44, '#ffe066', 8, 'right', null);
  }
  if (FADE.a > 0) { ctx.fillStyle = 'rgba(0,0,0,' + FADE.a + ')'; ctx.fillRect(0, 0, W, H); }
  drawCursor();
  if (!manual) requestAnimationFrame(frame);
}
function boot() {
  setScene(Title); requestAnimationFrame(frame); cv.focus();
  // watchdog: keep the game ticking in embedded views that pause animation frames
  setInterval(() => { const n = performance.now(); if (n - lastT > 80) frame(n, true); }, 33);
}
if (document.fonts && document.fonts.load) Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise(r => setTimeout(r, 1500))]).then(boot, boot);
else boot();
